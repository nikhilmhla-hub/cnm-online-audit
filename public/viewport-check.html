<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><title>Preview viewport check</title><style>body{background:#ddd;font:14px sans-serif;margin:15px}label{margin-right:15px}input{padding:8px}iframe{display:block;height:780px;margin:20px auto;border:1px solid #aaa;background:#090a0c}</style></head><body><label>Page path <input id="path" value="/demo"></label><label>Width <input id="width" type="number" value="390"></label><button id="apply">Apply viewport</button><iframe id="viewport" title="Preview at selected viewport" width="390" src="/demo"></iframe><script>document.querySelector('#apply').addEventListener('click',()=>{const frame=document.querySelector('#viewport');frame.width=document.querySelector('#width').value;const value=document.querySelector('#path').value;if(value.startsWith('/')&&!value.startsWith('//'))frame.src=value;});</script></body></html>
